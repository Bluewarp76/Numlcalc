          git apply ../paysage.patch
          # Appli separee : cohabite avec l'appli NumWorks officielle
          sed -i 's/applicationId = "com.numworks.calculator"/applicationId = "com.numworks.calculator.paysage"/' shared/ion/src/simulator/android/build.gradle
          sed -i 's/>NumWorks</>NumWorks Paysage</' shared/ion/src/simulator/android/src/res/values/strings.xml

      - name: Preparer l'environnement Android (Docker)
        working-directory: epsilon
        run: docker build -f tools/Dockerfile.android . --tag numworks-android

      - name: Creer une cle de signature
        working-directory: epsilon
        run: keytool -genkeypair -noprompt -keystore release.jks -storepass paysage -keypass paysage -alias paysage -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NumWorks Paysage"

      - name: Compiler l'APK
        working-directory: epsilon
        run: |
          docker run -i \
            --env MAKEFLAGS=-j4 \
            --env HOME=/monorepo/.home \
            --env ANDROID_SIGNING_STORE_FILE=/monorepo/release.jks \
            --env ANDROID_SIGNING_STORE_PASSWORD=paysage \
            --env ANDROID_SIGNING_KEY_ALIAS=paysage \
            --env ANDROID_SIGNING_KEY_PASSWORD=paysage \
            --env GRADLE_USER_HOME=/monorepo/.gradle \
            --mount type=bind,source=.,target=/monorepo \
            numworks-android sh -c "mkdir -p /monorepo/.home /opt/android-sdk/licenses && git config --global --add safe.directory '*' && printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > /opt/android-sdk/licenses/android-sdk-license && printf '84831b9409646a918e30573bab4c9c91346d8abd\n' > /opt/android-sdk/licenses/android-sdk-preview-license && make PLATFORM=android ARCHS='arm64-v8a armeabi-v7a' epsilon.apk"
          cp epsilon/output/release/android/epsilon.apk ../NumWorks-Paysage.apk

      - name: Mettre l'APK en telechargement
        uses: actions/upload-artifact@v4
        with:
          name: NumWorks-Paysage
          path: NumWorks-Paysage.apk
          retention-days: 30
